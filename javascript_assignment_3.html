<html>
  <body>
    <h3>Filtered Names</h3>
    <ul id="filtered-list"></ul>

    <script>
      // Original array of people
      const people = [
        "Alice Anderson",
        "Aaron Adams",
        "Bella Brown",
        "Brian Black",
        "Cathy Carter",
        "Charles Cooper",
        "Diana Davis",
        "Daniel Drake",
        "Ella Evans",
        "Ethan Edwards",
        "Fiona Fisher",
        "Frank Foster",
        "Grace Green",
        "Gavin Gray",
        "Hannah Harris",
        "Henry Hill",
        "Isabella Ingram",
        "Ian Irving",
        "Jack Johnson",
        "Julia James"
      ];

      
      const letter = "B";

     
      const result = people.filter((name) => {
        return name.charAt(0) === letter;
      });

      
      console.log("Filtered Names:", result);

     
      const list = document.getElementById("filtered-list");
      result.forEach((name) => {
        list.innerHTML += `<li>${name}</li>`;
      });
    </script>
  </body>
</html>
