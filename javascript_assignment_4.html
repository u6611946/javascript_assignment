<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Monster Detail</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
          Arial;
        padding: 24px;
        background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
        color: #111827;
      }

      h3 {
        margin-bottom: 8px;
      }

      select {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-size: 14px;
        min-width: 200px;
        background: white;
      }

      table {
        margin-top: 12px;
        border-collapse: collapse;
        width: 360px;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }

      th,
      td {
        padding: 10px 12px;
        text-align: left;
      }

      th {
        background: #0ea5a4;
        color: white;
        width: 120px;
        font-weight: 600;
      }

      td {
        background: #f8fafc;
        color: #111827;
      }

      .empty {
        color: #6b7280;
        font-style: italic;
      }
    </style>
  </head>

  <body>
    <h3>Monster Detail</h3>

    <div>Select Monster:</div>
    <div>
      <select id="monster-list" aria-label="Monster list"></select>
    </div>

    <hr />

    <div>
      <table>
        <tr>
          <th>ID</th>
          <td id="td-monster-id" class="empty"></td>
        </tr>
        <tr>
          <th>Name</th>
          <td id="td-monster-name" class="empty"></td>
        </tr>
        <tr>
          <th>HP</th>
          <td id="td-monster-hp" class="empty"></td>
        </tr>
        <tr>
          <th>EXP</th>
          <td id="td-monster-exp" class="empty"></td>
        </tr>
      </table>
    </div>

    <script>
      // Monster list as array of JSON objects
      const monsters = [
        { id: 1, name: "Fire Dragon", hp: 150, exp: 85 },
        { id: 2, name: "Ice Wolf", hp: 75, exp: 45 },
        { id: 3, name: "Shadow Goblin", hp: 40, exp: 25 },
        { id: 4, name: "Lightning Phoenix", hp: 200, exp: 120 },
        { id: 5, name: "Earth Golem", hp: 180, exp: 95 },
        { id: 6, name: "Poison Spider", hp: 60, exp: 35 },
        { id: 7, name: "Wind Eagle", hp: 90, exp: 55 },
        { id: 8, name: "Dark Skeleton", hp: 65, exp: 40 },
        { id: 9, name: "Crystal Unicorn", hp: 120, exp: 75 },
        { id: 10, name: "Lava Titan", hp: 250, exp: 150 }
      ];

      // DOM refs
      const selectEl = document.getElementById("monster-list");
      const tdId = document.getElementById("td-monster-id");
      const tdName = document.getElementById("td-monster-name");
      const tdHp = document.getElementById("td-monster-hp");
      const tdExp = document.getElementById("td-monster-exp");

      // Utility to clear table cells
      function clearTable() {
        [tdId, tdName, tdHp, tdExp].forEach((el) => {
          el.textContent = "";
          el.classList.add("empty");
        });
      }

      // Populate select with default "-" then monsters
      function populateSelect() {
        // Default option "-"
        const defaultOpt = document.createElement("option");
        defaultOpt.value = "-";
        defaultOpt.textContent = "-";
        selectEl.appendChild(defaultOpt);

        // Add options from monsters array
        // use option.value as the monster name (unique in this dataset)
        monsters.forEach((m) => {
          const opt = document.createElement("option");
          opt.value = m.name;
          opt.textContent = m.name;
          selectEl.appendChild(opt);
        });
      }

      // Update table when selection changes
      function onMonsterChange() {
        const selected = selectEl.value;

        if (selected === "-" || selected === "") {
          clearTable();
          return;
        }

        // find matching monster (for-of or forEach; here using find)
        const monster = monsters.find((m) => m.name === selected);

        if (!monster) {
          clearTable();
          return;
        }

        // Use textContent (safe) to update DOM
        tdId.textContent = monster.id;
        tdName.textContent = monster.name;
        tdHp.textContent = monster.hp;
        tdExp.textContent = monster.exp;

        // remove empty class so style updates
        [tdId, tdName, tdHp, tdExp].forEach((el) => el.classList.remove("empty"));
      }

      // init on DOM ready
      document.addEventListener("DOMContentLoaded", () => {
        populateSelect();
        clearTable();
        // Use onchange callback on the select element
        selectEl.addEventListener("change", onMonsterChange);
      });

      /* Note:
         - textContent is used instead of innerHTML to avoid injecting HTML and to keep text safe.
         - You could also set option.innerText or option.textContent; prefer textContent for better performance.
      */
    </script>
  </body>
</html>
